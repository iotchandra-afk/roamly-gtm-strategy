  <text x="42" y="108" font-size="34" font-weight="800" fill="#102A26">Local Food &amp; Market Walk</text>
  <text x="42" y="142" font-size="20" fill="#60736F">5 friends · Saturday · 10:00 AM</text>
  <line x1="42" y1="176" x2="568" y2="176" stroke="#E2E8E5" stroke-width="2"/>

  <g font-size="21" fill="#102A26">
    <circle cx="62" cy="224" r="18" fill="#CDE7DC"/><text x="96" y="232">You</text>
    <rect x="438" y="202" width="104" height="42" rx="21" fill="#DDF2E4"/><text x="490" y="230" text-anchor="middle" font-size="18" font-weight="700" fill="#187044">Paid</text>

    <circle cx="62" cy="288" r="18" fill="#E8D8C8"/><text x="96" y="296">Sara</text>
    <rect x="438" y="266" width="104" height="42" rx="21" fill="#DDF2E4"/><text x="490" y="294" text-anchor="middle" font-size="18" font-weight="700" fill="#187044">Paid</text>

    <circle cx="62" cy="352" r="18" fill="#D8E0F1"/><text x="96" y="360">Mike</text>
    <rect x="438" y="330" width="104" height="42" rx="21" fill="#DDF2E4"/><text x="490" y="358" text-anchor="middle" font-size="18" font-weight="700" fill="#187044">Paid</text>

    <circle cx="62" cy="416" r="18" fill="#F1DDC5"/><text x="96" y="424">Taylor</text>
    <rect x="422" y="394" width="120" height="42" rx="21" fill="#F1F3F2"/><text x="482" y="422" text-anchor="middle" font-size="18" fill="#64726F">Pending</text>

    <circle cx="62" cy="480" r="18" fill="#D6E9E5"/><text x="96" y="488">Jordan</text>
    <rect x="422" y="458" width="120" height="42" rx="21" fill="#F1F3F2"/><text x="482" y="486" text-anchor="middle" font-size="18" fill="#64726F">Pending</text>
  </g>

  <rect x="42" y="526" width="526" height="1" fill="#E2E8E5"/>
  <text x="42" y="566" font-size="18" fill="#60736F">One experience · individual payment · shared plan</text>
</g>

<g transform="translate(870 740)" font-family="Inter, Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="610" height="94" rx="24" fill="#102A26"/>
  <text x="34" y="37" font-size="17" font-weight="700" fill="#B8D8CE">PROOF ALREADY IN THE MARKETPLACE</text>
  <text x="34" y="70" font-size="22" font-weight="700" fill="#FFFFFF">12,000+ vetted experts · 40 cities · 3x repeat booking rate</text>
</g>
</svg>