<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Roamly Groups messaging asset</title>
<desc id="desc">Roamly Groups moves a friend group from interest to one shared booking with individual payments.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F8F7F2"/>
    <stop offset="62%" stop-color="#F4F7F4"/>
    <stop offset="100%" stop-color="#E9F1EC"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0F6B57"/>
    <stop offset="100%" stop-color="#0A4E42"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0B2D27" flood-opacity="0.12"/>
  </filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1410" cy="110" r="250" fill="#F2D9B3" opacity="0.5"/>
<path d="M0 770 C220 670 360 760 540 700 C730 635 885 725 1080 660 C1280 595 1430 650 1600 585 L1600 900 L0 900 Z" fill="#DCEAE3"/>
<path d="M0 812 C210 730 410 825 620 750 C810 685 980 790 1190 720 C1370 660 1495 710 1600 685 L1600 900 L0 900 Z" fill="#C8DDD3" opacity="0.9"/>

<g font-family="Inter, Arial, Helvetica, sans-serif" fill="#102A26">
  <text x="72" y="86" font-size="42" font-weight="700">Roamly</text>
  <text x="72" y="126" font-size="27" font-weight="600" fill="#0F6B57">GROUPS</text>

  <text x="72" y="224" font-size="72" font-weight="800">From “we should do this”</text>
  <text x="72" y="304" font-size="72" font-weight="800">to booked.</text>
  <text x="72" y="356" font-size="30" font-weight="500" fill="#35504B">One shared booking. Everyone pays their own share.</text>

  <g transform="translate(72 410)">
    <rect x="0" y="0" width="190" height="130" rx="24" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="42" cy="42" r="24" fill="#DDEFE8"/>
    <text x="42" y="52" text-anchor="middle" font-size="26">1</text>
    <text x="24" y="86" font-size="21" font-weight="700">Invite the group</text>
    <text x="24" y="114" font-size="17" fill="#60736F">Bring everyone in</text>
  </g>

  <g transform="translate(282 410)">
    <rect x="0" y="0" width="210" height="130" rx="24" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="42" cy="42" r="24" fill="#F8E4B8"/>
    <text x="42" y="52" text-anchor="middle" font-size="26">2</text>
    <text x="24" y="86" font-size="21" font-weight="700">Pay your share</text>
    <text x="24" y="114" font-size="17" fill="#60736F">No one fronts it all</text>
  </g>

  <g transform="translate(512 410)">
    <rect x="0" y="0" width="220" height="130" rx="24" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="42" cy="42" r="24" fill="#DFE5F7"/>
    <text x="42" y="52" text-anchor="middle" font-size="26">3</text>
    <text x="24" y="86" font-size="21" font-weight="700">Book together</text>
    <text x="24" y="114" font-size="17" fill="#60736F">One coordinated plan</text>
  </g>

  <rect x="72" y="576" width="304" height="70" rx="35" fill="url(#accent)"/>
  <text x="224" y="620" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">Start a Group →</text>

  <text x="72" y="710" font-size="24" font-weight="700" fill="#0F6B57">THE SHIFT</text>
  <text x="72" y="752" font-size="32" font-weight="700">One organizer stops carrying the group.</text>
  <text x="72" y="790" font-size="25" fill="#35504B">Everyone commits. Everyone pays. The group gets booked.</text>
</g>

<g transform="translate(870 115)" filter="url(#shadow)" font-family="Inter, Arial, Helvetica, sans-serif">
